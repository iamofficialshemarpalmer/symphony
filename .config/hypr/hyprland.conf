# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = nm-applet
source = ~/.config/hypr/monitors.hl
source = ~/.config/hypr/input.hl
source = ~/.config/hypr/bindings.hl
source = ~/.config/hypr/envs.hl
source = ~/.config/hypr/looknfeel.hl
source = ~/.config/hypr/autostart.hl
source = ~/.config/hypr/animations.hl
source = ~/.config/hypr/windowsrules.hl
source = ~/.config/hypr/tiling.hl
source = ~/.config/hypr/media.hl

# NVIDIA environment variables
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# SSH agent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ssh-agent -s | sed 's/^echo/#echo/' > $XDG_RUNTIME_DIR/ssh-agent-env
exec-once = source $XDG_RUNTIME_DIR/ssh-agent-env && ssh-add ~/.ssh/id_ed25519
