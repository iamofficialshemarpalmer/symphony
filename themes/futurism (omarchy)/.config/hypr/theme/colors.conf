# Theme: Omarchy futurism (omarchy)

$activeBorderColor = rgba(F0F8FFaa)
general { col.active_border = $activeBorderColor }
group { col.border_active = $activeBorderColor }
$secondary = $activeBorderColor
$outline_variant = rgba(F0F8FFff)
decoration {
    shadow {
        color = rgba(0A142880)
        color_inactive = rgba(0A14284d)
        offset = 2 2
        range = 20
        render_power = 3
    }
}
