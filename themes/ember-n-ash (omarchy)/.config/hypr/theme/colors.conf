# Theme: Omarchy ember-n-ash (omarchy)

$activeBorderColor = rgba(6c5b4caa)
general { col.active_border = $activeBorderColor }
group { col.border_active = $activeBorderColor }
$secondary = $activeBorderColor
$outline_variant = rgba(2a2a2aff)
decoration {
    shadow {
        color = rgba(1a1a1a80)
        color_inactive = rgba(1a1a1a4d)
        offset = 2 2
        range = 20
        render_power = 3
    }
}
